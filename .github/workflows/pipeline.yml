name: Pipeline

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    name: Release tooling checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.2

      - name: Validate release scripts and policies
        run: |
          set -euo pipefail
          bash -n scripts/deploy-application.sh
          python -m py_compile scripts/celery-release-control.py scripts/check_runtime_database.py scripts/validate_preflight_evidence.py scripts/tests/test_*.py
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run optional workflow linters
        shell: bash
        run: |
          set -euo pipefail
          if command -v actionlint >/dev/null 2>&1; then
            actionlint
          else
            echo "::notice::actionlint is unavailable; YAML policy tests remain enforced."
          fi
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/deploy-application.sh
          else
            echo "::notice::shellcheck is unavailable."
          fi

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: studflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install pytest
        run: pip install pytest

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done

      - name: Create non-superuser app role
        run: |
          PGPASSWORD=testpass psql -h localhost -U postgres -d studflow_test -c \
            "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=testpass psql -h localhost -U postgres -d studflow_test -c \
            "CREATE ROLE app_role LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'app_pw';"
          PGPASSWORD=testpass psql -h localhost -U postgres -d studflow_test -c \
            "GRANT USAGE ON SCHEMA public TO app_role;"
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:testpass@localhost:5432/studflow_test
        run: |
          set -o pipefail
          if ! OUTPUT=$(alembic upgrade head 2>&1); then
            printf '%s\n' "$OUTPUT"
            exit 1
          fi

      - name: Grant least-privilege runtime access
        run: |
          RUNTIME_TABLES="documents,user_preferences,ai_conversations,summaries,flashcards,document_chunks,quizzes,quiz_attempts,related_videos,study_annotations,ai_history,ai_messages,quiz_questions,ai_message_citations"
          PGPASSWORD=testpass psql -h localhost -U postgres -d studflow_test -v ON_ERROR_STOP=1 -c \
            "GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE $RUNTIME_TABLES TO app_role;"

      - name: Verify RLS is enabled and forced
        env:
          PGPASSWORD: testpass
        run: |
          OUTPUT=$(psql -h localhost -U postgres -d studflow_test -c "
            SELECT relname, relrowsecurity, relforcerowsecurity
            FROM pg_class
            WHERE relname IN ('documents','document_chunks','ai_conversations','ai_messages','ai_message_citations','quiz_attempts');
          ")
          printf '%s\n' "$OUTPUT"
          MISSING=$(psql -h localhost -U postgres -d studflow_test -tAc "
            SELECT count(*) FROM pg_class
            WHERE relname IN ('documents','document_chunks','ai_conversations','ai_messages','ai_message_citations','quiz_attempts')
            AND (relrowsecurity = false OR relforcerowsecurity = false);
          ")
          if [ "$MISSING" -ne "0" ]; then
            echo "::error::$MISSING RLS-required table(s) do not have RLS enabled+forced after migration."
            exit 1
          fi

      - name: Compile backend modules
        run: python -m compileall .

      - name: Smoke test FastAPI app import
        env:
          DATABASE_URL: postgresql+psycopg://app_role:app_pw@localhost:5432/studflow_test
        run: python -c "from main import app; print(app.title)"

      - name: Run backend unit tests
        env:
          DATABASE_URL: postgresql+psycopg://app_role:app_pw@localhost:5432/studflow_test
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Run pytest suite (RLS + prompt injection)
        env:
          DATABASE_URL: postgresql+psycopg://app_role:app_pw@localhost:5432/studflow_test
        run: PYTHONPATH=. pytest --import-mode=importlib eval/ -v

      - name: Verify Phase C evaluation baseline integrity (C6/C7)
        run: python eval/run_c6.py --baseline eval/results/c3_baseline_v2 --integrity-only
