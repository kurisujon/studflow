name: Production read-only preflight

on:
  workflow_dispatch:
    inputs:
      current_frontend_sha:
        description: "Reviewed full source SHA expected to match the running frontend image"
        required: true
        type: string
      current_backend_sha:
        description: "Reviewed full source SHA expected to match the running backend/worker image"
        required: true
        type: string
      confirmation:
        description: "Type PREFLIGHT ONLY to authorize read-only production inspection"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-application-operations
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify application rollback readiness
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://studflow.webcris.dev
    steps:
      - name: Validate preflight authorization
        env:
          PREFLIGHT_CONFIRMATION: ${{ inputs.confirmation }}
          CURRENT_FRONTEND_SHA: ${{ inputs.current_frontend_sha }}
          CURRENT_BACKEND_SHA: ${{ inputs.current_backend_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Run this workflow from main."; exit 1; }
          [ "$PREFLIGHT_CONFIRMATION" = "PREFLIGHT ONLY" ] || { echo "::error::Confirmation must exactly match PREFLIGHT ONLY."; exit 1; }
          [[ "$CURRENT_FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::current_frontend_sha must be a lowercase full SHA."; exit 1; }
          [[ "$CURRENT_BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::current_backend_sha must be a lowercase full SHA."; exit 1; }

      - name: Check out trusted preflight tooling
        uses: actions/checkout@v4

      - name: Configure pinned SSH authentication
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          port="${AZURE_VM_PORT:-22}"
          [[ "${AZURE_VM_HOST:-}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::AZURE_VM_HOST is invalid."; exit 1; }
          [[ "$port" =~ ^[0-9]+$ ]] && [ "$port" -ge 1 ] && [ "$port" -le 65535 ] || { echo "::error::AZURE_VM_PORT is invalid."; exit 1; }
          [ -n "${AZURE_VM_SSH_KEY:-}" ] && [ -n "${AZURE_VM_KNOWN_HOSTS:-}" ] || { echo "::error::Pinned SSH credentials are incomplete."; exit 1; }
          ssh_dir="$RUNNER_TEMP/studflow-preflight-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s' "$AZURE_VM_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$AZURE_VM_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          query="$AZURE_VM_HOST"; [ "$port" = 22 ] || query="[$AZURE_VM_HOST]:$port"
          ssh-keygen -F "$query" -f "$ssh_dir/known_hosts" >/dev/null || { echo "::error::Pinned known-hosts entry does not match the target."; exit 1; }

      - name: Create ephemeral remote inspection directory
        id: remote
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${AZURE_VM_USER:-}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "::error::AZURE_VM_USER is invalid."; exit 1; }
          port="${AZURE_VM_PORT:-22}"
          ssh_args=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/studflow-preflight-ssh/known_hosts" -o ConnectTimeout=10 -o LogLevel=ERROR -i "$RUNNER_TEMP/studflow-preflight-ssh/id_ed25519" -p "$port")
          target="${AZURE_VM_USER}@${AZURE_VM_HOST}"
          remote_dir="$(ssh "${ssh_args[@]}" "$target" 'umask 077; mktemp -d /tmp/studflow-preflight.XXXXXX')"
          [[ "$remote_dir" =~ ^/tmp/studflow-preflight\.[A-Za-z0-9]+$ ]] || { echo "::error::Unexpected remote temporary path."; exit 1; }
          printf 'directory=%s\n' "$remote_dir" >> "$GITHUB_OUTPUT"
          scp -q -P "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/studflow-preflight-ssh/known_hosts" -i "$RUNNER_TEMP/studflow-preflight-ssh/id_ed25519" scripts/celery-release-control.py "$target:$remote_dir/celery-release-control.py"

      - name: Inspect production application without mutation
        id: inspection
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_APP_PATH: ${{ secrets.AZURE_VM_APP_PATH }}
          REMOTE_DIR: ${{ steps.remote.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          port="${AZURE_VM_PORT:-22}"
          app_path="${AZURE_VM_APP_PATH:-/home/${AZURE_VM_USER}/studflow}"
          [[ "$app_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::AZURE_VM_APP_PATH is invalid."; exit 1; }
          [[ "$REMOTE_DIR" =~ ^/tmp/studflow-preflight\.[A-Za-z0-9]+$ ]] || { echo "::error::Remote evidence path is invalid."; exit 1; }
          ssh_args=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/studflow-preflight-ssh/known_hosts" -o ConnectTimeout=10 -o LogLevel=ERROR -i "$RUNNER_TEMP/studflow-preflight-ssh/id_ed25519" -p "$port")
          target="${AZURE_VM_USER}@${AZURE_VM_HOST}"
          remote_evidence="$REMOTE_DIR/inspection.evidence"
          local_evidence="$RUNNER_TEMP/studflow-production-evidence"
          rm -f -- "$local_evidence"
          ssh "${ssh_args[@]}" "$target" bash -s -- "$app_path" "$REMOTE_DIR/celery-release-control.py" "$remote_evidence" <<'REMOTE' >/dev/null
          set -euo pipefail
          app_dir="$1"; celery_control="$2"; evidence_path="$3"; env_path="$app_dir/.env.production"
          case "$evidence_path" in /tmp/studflow-preflight.*\/inspection.evidence) ;; *) echo "Remote evidence path is invalid." >&2; exit 1;; esac
          umask 077
          [ -f "$app_dir/docker-compose.yml" ] && [ -f "$env_path" ] || { echo "Production Compose inputs are missing." >&2; exit 1; }
          command -v docker >/dev/null && command -v python3 >/dev/null || { echo "Required runtime tooling is missing." >&2; exit 1; }
          cd "$app_dir"
          compose() { docker compose --env-file "$env_path" "$@" < /dev/null; }
          env_mode="$(stat -c '%a' "$env_path")"
          case "$env_mode" in *[!0-7]*|'') echo "Production environment permissions are invalid." >&2; exit 1;; esac
          [ $((10#$env_mode % 100)) -eq 0 ] || { echo "Production environment file must not be group/world accessible." >&2; exit 1; }
          case "$(uname -m)" in
            x86_64) host_platform=linux/amd64 ;;
            aarch64|arm64) host_platform=linux/arm64 ;;
            *) echo "Unsupported production host architecture." >&2; exit 1 ;;
          esac
          expected_services="$(printf '%s\n' backend caddy frontend postgres redis worker)"
          actual_services="$(compose config --services | LC_ALL=C sort)"
          [ "$actual_services" = "$expected_services" ] || { echo "Compose service relationships are unexpected." >&2; exit 1; }
          digest() {
            service="$1"; repository="$2"; container="$(compose ps -q "$service")"
            case "$container" in *[!0-9a-f]*|'') return 1;; esac
            [ "$(docker inspect --format '{{.State.Status}}' "$container")" = running ] || return 1
            image_id="$(docker inspect --format '{{.Image}}' "$container")"
            docker image inspect "$image_id" >/dev/null
            [ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")" = "$host_platform" ] || return 1
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image_id" |
              awk -v prefix="$repository@sha256:" 'index($0,prefix)==1 && length($0)==length(prefix)+64 {print; exit}'
          }
          for service in frontend backend worker caddy postgres redis; do
            container="$(compose ps -q "$service")"; case "$container" in *[!0-9a-f]*|'') echo "Missing service $service." >&2; exit 1;; esac
            [ "$(docker inspect --format '{{.State.Status}}' "$container")" = running ] || { echo "Service $service is not running." >&2; exit 1; }
            [ "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$container")" = "$(pwd -P)" ] || { echo "Compose project path mismatch." >&2; exit 1; }
            [ "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$container")" = "$service" ] || { echo "Compose service metadata mismatch." >&2; exit 1; }
          done
          frontend_digest="$(digest frontend ghcr.io/kurisujon/studflow-frontend)"
          backend_digest="$(digest backend ghcr.io/kurisujon/studflow-backend)"
          worker_digest="$(digest worker ghcr.io/kurisujon/studflow-backend)"
          [[ "$frontend_digest" =~ ^ghcr\.io/kurisujon/studflow-frontend@sha256:[0-9a-f]{64}$ ]] || { echo "Frontend rollback digest is invalid." >&2; exit 1; }
          [[ "$backend_digest" =~ ^ghcr\.io/kurisujon/studflow-backend@sha256:[0-9a-f]{64}$ ]] || { echo "Backend rollback digest is invalid." >&2; exit 1; }
          [ "$backend_digest" = "$worker_digest" ] || { echo "Backend and worker rollback digests differ." >&2; exit 1; }
          frontend_container="$(compose ps -q frontend)"
          case "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$frontend_container")" in *docker-compose.yml*) ;; *) echo "Compose metadata mismatch." >&2; exit 1;; esac
          required_keys='FRONTEND_IMAGE BACKEND_IMAGE POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD DATABASE_URL NEXT_PUBLIC_API_BASE_URL INTERNAL_API_BASE_URL NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY GEMINI_API_KEY'
          for key in $required_keys; do
            awk -F= -v key="$key" '$1==key && length(substr($0,index($0,"=")+1))>0 {found=1} END {exit !found}' "$env_path" || { echo "Required production environment key is missing." >&2; exit 1; }
          done
          compose exec -T --interactive=false postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null < /dev/null
          compose exec -T --interactive=false backend python -c 'from sqlalchemy import text; from core.database import engine; connection=engine.connect(); connection.execute(text("SELECT 1")).scalar_one(); role=connection.execute(text("SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname=current_user")).one_or_none(); connection.close(); assert role is not None and not bool(role[0]) and not bool(role[1])' >/dev/null < /dev/null
          [ "$(compose exec -T --interactive=false redis redis-cli ping < /dev/null | tr -d '\r')" = PONG ] || { echo "Redis PING failed." >&2; exit 1; }
          celery_json="$(STUDFLOW_COMPOSE_ENV_FILE="$env_path" python3 "$celery_control" inspect < /dev/null)"
          celery_evidence="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["worker_nodes"]==1; print("celery_active="+str(d["active"])); print("celery_reserved="+str(d["reserved"])); print("celery_scheduled="+str(d["scheduled"])); print("repair_task_blockers="+str(d["repair_task_blockers"]))' "$celery_json")"
          available_kb="$(df -Pk "$app_dir" | awk 'NR==2 {print $4}')"; case "$available_kb" in *[!0-9]*|'') exit 1;; esac
          [ "$available_kb" -ge 2097152 ] || { echo "Less than 2 GiB is available for release images." >&2; exit 1; }
          evidence_temp="$(mktemp "$evidence_path.XXXXXX")"
          trap 'rm -f -- "$evidence_temp"' EXIT
          {
            printf 'host_architecture=%s\n' "$host_platform"
            printf 'compose_project=ok\npostgres_ready=ok\ndatabase_role=ok\nredis_ping=ok\nenvironment_prerequisites=ok\n'
            printf 'available_kb=%s\n' "$available_kb"
            printf '%s\n' "$celery_evidence"
            printf 'frontend_digest=%s\nbackend_digest=%s\nworker_digest=%s\nlocal_rollback_images=ok\n' "$frontend_digest" "$backend_digest" "$worker_digest"
          } > "$evidence_temp"
          chmod 600 "$evidence_temp"
          mv -f -- "$evidence_temp" "$evidence_path"
          trap - EXIT
          REMOTE
          ssh "${ssh_args[@]}" "$target" test -f "$remote_evidence" </dev/null || { echo "::error::Production evidence file was not created."; exit 1; }
          scp -q -P "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/studflow-preflight-ssh/known_hosts" -o ConnectTimeout=10 -i "$RUNNER_TEMP/studflow-preflight-ssh/id_ed25519" "$target:$remote_evidence" "$local_evidence" || { echo "::error::Production evidence transfer failed closed."; exit 1; }
          chmod 600 "$local_evidence"
          python3 scripts/validate_preflight_evidence.py "$local_evidence" "$GITHUB_OUTPUT" || { echo "::error::Production evidence validation failed closed."; exit 1; }

      - name: Verify rollback manifests with read-only registry access
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          FRONTEND_DIGEST: ${{ steps.inspection.outputs.frontend_digest }}
          BACKEND_DIGEST: ${{ steps.inspection.outputs.backend_digest }}
          CURRENT_FRONTEND_SHA: ${{ inputs.current_frontend_sha }}
          CURRENT_BACKEND_SHA: ${{ inputs.current_backend_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GHCR_USERNAME:-}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]] && [ -n "${GHCR_PAT:-}" ] || { echo "::error::Read-only GHCR credentials are incomplete."; exit 1; }
          port="${AZURE_VM_PORT:-22}"
          ssh_args=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/studflow-preflight-ssh/known_hosts" -o ConnectTimeout=10 -o LogLevel=ERROR -i "$RUNNER_TEMP/studflow-preflight-ssh/id_ed25519" -p "$port")
          target="${AZURE_VM_USER}@${AZURE_VM_HOST}"
          remote='set -euo pipefail; config=$(mktemp -d /tmp/studflow-registry.XXXXXX); trap '\''rm -rf -- "$config"'\'' EXIT; chmod 700 "$config"; IFS= read -r token; printf %s "$token" | DOCKER_CONFIG="$config" docker login ghcr.io -u "$1" --password-stdin >/dev/null 2>&1; unset token; same(){ DOCKER_CONFIG="$config" docker manifest inspect "$1" > "$config/tag.json"; DOCKER_CONFIG="$config" docker manifest inspect "$2" > "$config/digest.json"; python3 -c '\''import json,sys; assert json.load(open(sys.argv[1])) == json.load(open(sys.argv[2]))'\'' "$config/tag.json" "$config/digest.json"; }; DOCKER_CONFIG="$config" docker manifest inspect "$2" >/dev/null; DOCKER_CONFIG="$config" docker manifest inspect "$3" >/dev/null; same ghcr.io/kurisujon/studflow-frontend:$4 "$2"; same ghcr.io/kurisujon/studflow-backend:$5 "$3"; printf "registry_manifests=ok\nsource_revisions=ok\n"'
          shell_quote() { printf "'%s'" "${1//\'/\'\\\'\'}"; }
          remote_command="bash -c $(shell_quote "$remote") -- $(shell_quote "$GHCR_USERNAME") $(shell_quote "$FRONTEND_DIGEST") $(shell_quote "$BACKEND_DIGEST") $(shell_quote "$CURRENT_FRONTEND_SHA") $(shell_quote "$CURRENT_BACKEND_SHA")"
          result="$(printf '%s\n' "$GHCR_PAT" | ssh "${ssh_args[@]}" "$target" "$remote_command")" || { echo "::error::Rollback manifest verification failed."; exit 1; }
          [ "$result" = $'registry_manifests=ok\nsource_revisions=ok' ] || { echo "::error::Unexpected registry evidence."; exit 1; }
          printf '%s\n' "$result"

      - name: Write sanitized preflight summary
        env:
          HOST_ARCH: ${{ steps.inspection.outputs.host_architecture }}
          AVAILABLE_KB: ${{ steps.inspection.outputs.available_kb }}
          ACTIVE: ${{ steps.inspection.outputs.celery_active }}
          RESERVED: ${{ steps.inspection.outputs.celery_reserved }}
          SCHEDULED: ${{ steps.inspection.outputs.celery_scheduled }}
          REPAIR: ${{ steps.inspection.outputs.repair_task_blockers }}
          FRONTEND_DIGEST: ${{ steps.inspection.outputs.frontend_digest }}
          BACKEND_DIGEST: ${{ steps.inspection.outputs.backend_digest }}
          CURRENT_FRONTEND_SHA: ${{ inputs.current_frontend_sha }}
          CURRENT_BACKEND_SHA: ${{ inputs.current_backend_sha }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Production application preflight"
            echo "- Pinned SSH and protected environment: PASS"
            echo "- Compose, environment prerequisites, PostgreSQL, Redis: PASS"
            echo "- Host architecture: \`$HOST_ARCH\`; available KiB: \`$AVAILABLE_KB\`"
            echo "- Celery tasks — active: \`$ACTIVE\`, reserved: \`$RESERVED\`, scheduled: \`$SCHEDULED\`, repair blockers: \`$REPAIR\`"
            echo "- Local rollback images and read-only registry manifests: PASS"
            echo "- Running image digests resolve from the reviewed source SHA tags: PASS"
            echo "- Frontend source: \`$CURRENT_FRONTEND_SHA\`; backend source: \`$CURRENT_BACKEND_SHA\`"
            echo "- Frontend rollback: \`$FRONTEND_DIGEST\`"
            echo "- Backend/worker rollback: \`$BACKEND_DIGEST\`"
            echo "- Production state changed: NO"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral SSH and remote files
        if: ${{ always() }}
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          REMOTE_DIR: ${{ steps.remote.outputs.directory }}
        shell: bash
        run: |
          set +e
          port="${AZURE_VM_PORT:-22}"
          if [[ "${REMOTE_DIR:-}" =~ ^/tmp/studflow-preflight\.[A-Za-z0-9]+$ ]] && [ -f "$RUNNER_TEMP/studflow-preflight-ssh/id_ed25519" ]; then
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/studflow-preflight-ssh/known_hosts" -o LogLevel=ERROR -i "$RUNNER_TEMP/studflow-preflight-ssh/id_ed25519" -p "$port" "${AZURE_VM_USER}@${AZURE_VM_HOST}" rm -rf -- "$REMOTE_DIR"
          fi
          rm -rf -- "$RUNNER_TEMP/studflow-preflight-ssh"
          rm -f -- "$RUNNER_TEMP/studflow-production-evidence"
